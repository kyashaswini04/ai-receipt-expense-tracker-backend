spring.application.name=ai-receipt-expense-tracker

# DATABASE - set SPRING_DATASOURCE_PASSWORD in your terminal or Render environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ai_expense_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# SERVER
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT - use a unique secret of at least 32 bytes in production
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - SecurityConfig reads this exact property
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://ai-receipt-expense-tracker-frontend.vercel.app,https://ai-receipt-expense-tracker-frontend-*.vercel.app}
